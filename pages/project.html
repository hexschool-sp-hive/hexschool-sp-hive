<!DOCTYPE html>
<html lang="en">
  <%- include('./layout/head', {page:'作品'}); -%>
<body>
  <%- include('./layout/header'); -%>
  <div class="bg-blue-50"
    style="
      background-image: url('../assets/images/sky_background.jpg');
      background-size: 100%;
      background-repeat: no-repeat;
    "
  >
    <!-- 作品介紹 -->
    <section class="">
      <div class="container pt-lg-4_5r">
        <div class="border-4 border-blue-800 border bg-blue-100">
          <div class="row mx-0">
            <!-- 標題 -->
            <div class="col-lg-12 bg-blue-800 custom-shadow-top-left-white border-4 border-blue-800 border-bottom">
              <h1 class="mb-0 text-center text-white pt-lg-5">多角對抗戰</h1>
              <div class="d-flex justify-content-center mt-4">
                <span class="tag me-2">java</span>
                <span class="tag me-2">unity</span>
                <span class="tag">射擊</span>
              </div>
              <div class="d-flex justify-content-center mt-4 mb-4">
                <div class="toggle custom-shadow-top-left-white">
                  <img
                    class="toggle-icon me-3"
                    src="../assets/icons/social-rewards-heart-like-circle-gray.svg"
                    alt="like"
                  />
                  <span class="me-3">最愛</span>
                  <span>33</span>
                </div>
                <div class="toggle custom-shadow-top-left-white">
                  <img
                    class="toggle-icon me-3"
                    src="../assets/icons/social-rewards-certified-ribbon-gray.svg"
                    alt="like"
                  />
                  <span class="me-3">收藏</span>
                  <span>30</span>
                </div>
                <div class="toggle custom-shadow-top-left-white">
                  <img
                    class="toggle-icon me-3"
                    src="../assets/icons/interface-essential-message-gray.svg"
                    alt="like"
                  />
                  <span class="me-3">留言</span>
                  <span>14</span>
                </div>
              </div>
            </div>
          </div>
          <!-- 描述 -->
          <div class="row mx-0">
            <div class="col-lg-9 px-0">
              <div class="info-body info-shadow mb-1">
                <img
                  class="img-fluid d-block mx-auto"
                  src="../assets/images/game_image.png"
                  alt="game_image"
                />
                <div class="d-flex justify-content-between mt-2r">
                  <div class="dot">
                    <div class="dot-body dot-active"></div>
                    <div class="dot-body"></div>
                    <div class="dot-body"></div>
                  </div>
                  <div class="d-flex align-items-center">
                    <button disabled class="custom-btn-small btn-primary me-0_75r">
                      <img
                        class=""
                        src="../assets/icons/arrow_left.svg"
                        alt="arrow_left"
                      />
                    </button>
                    <button class="custom-btn-small btn-primary">
                      <img
                        class=""
                        src="../assets/icons/arrow_right.svg"
                        alt="arrow_right"
                      />
                    </button>
                  </div>
                </div>
              </div>
            </div>
            <!-- 關於作者 -->
            <div class="col-lg-3 px-0">
              <div class="author">
                <div class="mb-4 author-border">
                  <div class="d-flex align-items-center mb-3">
                    <div class="author-img me-3">
                      <img
                        class="img-fluid border-black border border-4 w-lg-auto"
                        src="../assets/images/photo_王小明.jpg"
                        alt="people"
                      />
                    </div>
                    <div class="w-50 text-center">
                      <div class="author-number">6</div>
                      <div class="author-number-name">專案</div>
                    </div>
                    <div class="w-50 text-center">
                      <div class="author-number">33</div>
                      <div class="author-number-name">追蹤中</div>
                    </div>
                  </div>
                  <div class="mb-4">
                    <div class="author-name">王小明</div>
                    <div class="author-intro">致力於開發有趣的遊戲，喜歡有趣的事物。</div>
                  </div>
                </div>
                <div class="">
                  <div class="mb-4">
                    <div class="author-link-title mb-2">專案連結</div>
                    <a href="https://example.com" class="author-link">
                      <div class="">
                        <img
                          class="author-link-img"
                          src="../assets/icons/interface-essential-link.svg"
                          alt="link"
                        >
                        <span class="ms-2">https://example.com</span>
                      </div>
                    </a>
                  </div>
                  <div class="mb-4">
                    <div class="author-link-title mb-2">說明文件</div>
                    <a href="https://www.book.com" class="author-link">
                      <div class="">
                        <img
                          class="author-link-img"
                          src="../assets/icons/interface-essential-clip-1.svg"
                          alt="clip"
                        >
                        <span class="ms-2">https://www.book.com</span>
                      </div>
                    </a>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
      </div>
    </section>
  </div>
  <%- include('./layout/footer'); -%>
  <script type="module" src="../main.js"></script>
</body>
</html>
